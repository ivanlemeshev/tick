version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - errorlint # wrapped errors compared with == or type assertions
    - gocritic # common bug patterns and style issues
    - misspell
    - nilerr # returning nil when an error was checked
    - nolintlint # malformed or unused //nolint directives
    - unconvert # needless type conversions
    - unparam # parameters or results that never vary

formatters:
  enable:
    - gofmt
    - goimports

issues:
  # Show every issue: by default only 50 per linter and 3 identical ones are shown.
  max-issues-per-linter: 0
  max-same-issues: 0
