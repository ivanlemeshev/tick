name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly, to catch newly published queries

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

# This advanced setup replaces GitHub's CodeQL default setup, which must stay
# disabled: code scanning rejects results when both are enabled.
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload results to code scanning
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go # built with the toolchain pinned in mise.toml
            build-mode: manual
          - language: actions # the workflow files themselves
            build-mode: none
    steps:
      - uses: actions/checkout@v7
      - if: matrix.build-mode == 'manual'
        uses: jdx/mise-action@v5
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - if: matrix.build-mode == 'manual'
        run: mise run build
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:${{ matrix.language }}
